name: CI

# Validates the marketplace manifest and keeps the README in sync with it.
# Zero-dependency Node scripts — no npm install, no lockfile.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate manifest + README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate marketplace.json
        # GITHUB_TOKEN lifts the GitHub API rate limit for the
        # source-repo existence checks. A 404 fails; rate-limit / 5xx warn.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate.mjs

      - name: Check README is generated from the manifest
        run: node scripts/render-readme.mjs --check
